        } else {
            emptyState.classList.add('hidden');
        }
    }

    searchInput.addEventListener('input', (e) => {
        renderTable(e.target.value);
    });

    function downloadIncomeCSV() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // Add BOM
        csvContent += "Date,Name,Amount,Notes\n";
        incomeData.forEach(item => {
            csvContent += `${item.date},${item.name},${item.amount},${item.note}\n`;
        });
        triggerDownload(csvContent, "income_data.csv");
    }

    function downloadExpenseCSV() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // Add BOM
        csvContent += "Date,Name,Amount,Notes\n";
        expenseData.forEach(item => {
            csvContent += `${item.date},${item.name},${item.amount},${item.note}\n`;
        });
        triggerDownload(csvContent, "expense_data.csv");
    }

    function triggerDownload(content, fileName) {
        const encodedUri = encodeURI(content);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Initial Init
    calculateTotals();
    renderTable();

</script>
</body>

</html>
